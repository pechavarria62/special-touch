<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1e3a5f" />
    <!-- Favicons: the cream logo on navy. -->
    <link rel="icon" href="public/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="public/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="public/favicon-48.png" />
    <link rel="apple-touch-icon" href="public/apple-touch-icon.png" />
    <link rel="manifest" href="public/site.webmanifest" />
    <!-- Apply saved accessibility settings before the first paint (see src/a11y/settings.ts). -->
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('st-a11y:v1') || '{}').settings || {}
        for (var k in s) if (/^[a-z-]+$/.test(k) && s[k] > 0 && s[k] < 4) document.documentElement.setAttribute('data-st-' + k, String(s[k]))
      } catch (e) {}
    </script>
    <title>Special Touch Ministry | Opening the doors of the church to every body</title>
    <meta name="description" content="Since 1982, Special Touch Ministry has helped people with disabilities experience God, belong in the church, and build lasting friendships." />
  </head>
  <body>
    <div id="top">
      <a class="skip-link btn btn-primary" href="#main">Skip to main content</a>
      <button type="button" class="skip-link btn btn-primary" data-a11y-open>Accessibility options</button>
    </div>

    <header id="site-header"></header>

    <main id="main" tabindex="-1" class="focus:outline-none">
      <noscript>
        <div class="wrap py-16">
          <h1 class="text-4xl">Special Touch Ministry, Inc.</h1>
          <p class="mt-4 max-w-2xl text-lg">
            This website needs JavaScript. To reach us, call <a href="tel:+17152582713">715-258-2713</a> or email
            <a href="mailto:ministry@specialtouch.org">ministry@specialtouch.org</a>.
          </p>
        </div>
      </noscript>
    </main>

    <footer id="site-footer" class="on-dark bg-navy-800 text-cream"></footer>

    <!-- Announces each page change to screen readers. -->
    <div id="route-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
